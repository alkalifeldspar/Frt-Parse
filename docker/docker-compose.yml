# FRT database + admin UI
#
#   cp .env.example .env      # then set the passwords
#   docker compose up -d --build
#
# Admin UI:  http://localhost:8080   (UI_USERNAME / UI_PASSWORD)
# MySQL:     127.0.0.1:3306          (root / MYSQL_ROOT_PASSWORD, or the optional read-only user)

name: frt

services:
  frt:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: frt-db:latest
    # Rebuild on every `docker compose up` (layer cache keeps it quick). Without
    # this, compose silently reuses an existing frt-db:latest and code changes in
    # the repo never reach the container.
    pull_policy: build
    restart: unless-stopped
    environment:
      # --- required secrets ---------------------------------------------------
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:?Set UI_PASSWORD in docker/.env}
      # --- optional -------------------------------------------------------------
      FRT_DB_NAME: ${FRT_DB_NAME:-FRT}
      FRT_READONLY_USER: ${FRT_READONLY_USER:-}
      FRT_READONLY_PASSWORD: ${FRT_READONLY_PASSWORD:-}
      PARSE_WORKERS: ${PARSE_WORKERS:-1}
      SPLIT_WRITERS: ${SPLIT_WRITERS:-2}
      MIN_ROW_RATIO: ${MIN_ROW_RATIO:-0.9}
      KEEP_PREVIOUS: ${KEEP_PREVIOUS:-true}
      TZ: ${TZ:-UTC}
    ports:
      - "${UI_BIND:-0.0.0.0}:${UI_PORT:-8080}:8080"
      # Bound to localhost by default; set MYSQL_BIND=0.0.0.0 to reach MySQL from other hosts.
      - "${MYSQL_BIND:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql   # live, staging and previous databases
      - frt-data:/data              # downloaded PDF, temporary work files, logs, state
    # Give MySQL time to flush cleanly on `docker compose down`.
    stop_grace_period: 2m

volumes:
  mysql-data:
  frt-data:
